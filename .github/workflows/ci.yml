name: Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: native
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo fmt --manifest-path agent/Cargo.toml -- --check
      - if: matrix.target == 'native'
        run: cargo test --locked --manifest-path agent/Cargo.toml
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo check --locked --target x86_64-pc-windows-msvc --manifest-path agent/Cargo.toml

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      SENTINEL_TEST_DATABASE_URL: postgres://sentinel:sentinel-test-only@localhost:5432/sentinel_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/sentinel
      - run: node --check web/app.js
      - run: node --test web/app.test.mjs
